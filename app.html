<div class="app-window" id="UnitPriceApp">
  <div class="app-header"><span class="app-title">🏷️ Unit Price Compare</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="wrap">
      <div class="row"><b>Item A</b> &nbsp; $<input id="up-ap" type="number" value="3.99" style="width:80px"> for <input id="up-as" type="number" value="12" style="width:70px"> units</div>
      <div class="muted" id="up-ar">$0.33 each</div>
      <div class="row"><b>Item B</b> &nbsp; $<input id="up-bp" type="number" value="6.49" style="width:80px"> for <input id="up-bs" type="number" value="24" style="width:70px"> units</div>
      <div class="muted" id="up-br">$0.27 each</div>
      <div class="res" id="up-win">Item B is the better deal</div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
